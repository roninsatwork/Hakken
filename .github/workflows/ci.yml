name: CI

on:
  push:
    branches:
      - dev
    # A plan or a README cannot break lint, types or a test. These are the only
    # paths where that is true — anything under src/ or convex/ still runs.
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
  pull_request:
    branches:
      - dev
      - main

# Only the newest commit on a branch is worth testing. Without this, pushing
# three times in ten minutes runs the whole suite three times and nobody ever
# reads the first two results. `main` is exempt: those runs gate a deploy, so
# each commit's result has to stand on its own.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  checks:
    # One runner, not two. Lint, types and unit tests used to sit in one job
    # and the browser smoke subset in another, and each paid its own checkout,
    # Node setup and package restore — roughly three minutes of getting ready,
    # billed twice for a single push. Together they get ready once.
    #
    # The trade is wall-clock, deliberately taken: the browser subset now waits
    # for the unit suite rather than running beside it. The bill is what was
    # hurting, not the wait.
    name: Checks
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node environment
        uses: actions/setup-node@v5
        with:
          node-version: '24.18.0'
          cache: 'npm'

      # The same 1.1GB of packages every run, changing only when the lockfile
      # does. Fetching them was about half the wall time of a check.
      #
      # The Linux rollup binary is installed before the cache is written, so a
      # hit already contains it. If that workaround ever needs to change, bump
      # the key's suffix — a stale cache would otherwise keep serving the old
      # tree and the failure would look unrelated to whatever you changed.
      - name: Restore installed packages
        id: packages
        uses: actions/cache@v4
        with:
          path: node_modules
          key: node-modules-v1-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        if: steps.packages.outputs.cache-hit != 'true'
        run: npm ci

      - name: Workaround NPM Optional Dependency Bug
        if: steps.packages.outputs.cache-hit != 'true'
        run: npm install @rollup/rollup-linux-x64-gnu --no-save

      # Socket complements npm audit with supply-chain and package-policy
      # analysis. Run it only for direct pushes to dev: pull requests do not
      # receive repository secrets from forks, and main deploys code that has
      # already passed through dev. An unhealthy report blocks the push check
      # before the more expensive test and browser stages run.
      - name: Run Socket dependency security scan
        if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
        env:
          SOCKET_SECURITY_API_KEY: ${{ secrets.SOCKET_SECURITY_API_KEY }}
        run: npx --yes socket@1.1.158 ci

      # Two faults the rest of this job cannot see: a source file made binary
      # by a stray NUL byte, and a Convex function running a second paginated
      # query. Both compile, lint and test clean, so they run first and cheaply.
      - name: Run source guards
        run: npm run check:guards

      - name: Run lint
        run: npm run lint

      - name: Run typecheck
        run: npm run typecheck

      # Coverage runs here, not only on PRs into main, because dev previously
      # accumulated changes with no coverage enforcement at all. This runs the
      # full unit/integration suite, so no separate test:run step is needed.
      # The browser suite stays in the full gate below.
      - name: Run unit and integration tests with coverage
        run: npm run test:coverage

      - name: Check coverage thresholds
        run: npm run coverage:check

      # Everything browser-related sits after the cheap checks on purpose: a
      # failing lint should not first pay to fetch a browser it will never open.
      - name: Restore Playwright browser
        id: playwright
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-v1-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      # A cache hit still needs the system libraries Chromium links against;
      # those live in /usr/lib, not in the cached browser directory. Installing
      # them alone is seconds, against roughly a minute and a half for the
      # browser download it replaces.
      - name: Install Playwright browser
        if: steps.playwright.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Install Playwright system libraries
        if: steps.playwright.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      # A four-spec browser subset on every push/PR. The full suite used to run
      # only on PRs into main, which left daily work on dev with no browser
      # coverage at all — breakage was discovered in a batch at release time
      # (maintenance plan M3.1).
      - name: Run browser smoke tests
        run: npm run test:e2e:smoke

      - name: Upload coverage report
        # Only when something failed. A 28MB upload after every green check was
        # paid for and never opened.
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report-quick
          path: coverage/
          if-no-files-found: ignore

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-smoke
          path: playwright-report/
          if-no-files-found: ignore

  real-auth-smoke:
    # The mocked e2e suite proves the screens; nothing proved the wiring between
    # them and Convex, because `next.config.ts` aliases `convex/react` to a mock
    # whenever the e2e flag is on. This job is the only one that signs in through
    # real Convex Auth against a real deployment.
    #
    # PRs into main only. It deploys to a real deployment and CI minutes are
    # metered — see "What A Push Costs" in AGENTS.md.
    #
    # It fails loudly when its two secrets are absent rather than skipping: a
    # gate that quietly passes when unconfigured is the exact honesty gap this
    # job exists to close.
    name: Real Auth Smoke (real Convex)
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 25

    env:
      LOCAL_TEST_AUTH_ENABLED: '1'
      NEXT_PUBLIC_CONVEX_URL: ${{ secrets.CONVEX_TEST_DEPLOYMENT_URL }}
      CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_TEST_DEPLOY_KEY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node environment
        uses: actions/setup-node@v5
        with:
          node-version: '24.18.0'
          cache: 'npm'

      - name: Restore installed packages
        id: packages
        uses: actions/cache@v4
        with:
          path: node_modules
          key: node-modules-v1-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        if: steps.packages.outputs.cache-hit != 'true'
        run: npm ci

      - name: Workaround NPM Optional Dependency Bug
        if: steps.packages.outputs.cache-hit != 'true'
        run: npm install @rollup/rollup-linux-x64-gnu --no-save

      - name: Restore Playwright browser
        id: playwright
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-v1-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright browser
        if: steps.playwright.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Install Playwright system libraries
        if: steps.playwright.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      # Minted per run and masked, so no long-lived test credential exists to
      # leak or to rotate. It has to match in three places — the deployment, the
      # seeding script and the specs — which it does by living in the job env.
      - name: Mint the run's local test auth secret
        run: |
          secret="$(openssl rand -hex 24)"
          echo "::add-mask::$secret"
          echo "LOCAL_TEST_AUTH_SECRET=$secret" >> "$GITHUB_ENV"

      - name: Configure the test deployment
        run: |
          npx convex env set LOCAL_TEST_AUTH_ENABLED 1
          npx convex env set LOCAL_TEST_AUTH_SECRET "$LOCAL_TEST_AUTH_SECRET"

      - name: Deploy Convex functions to the test deployment
        run: npx convex deploy

      - name: Seed the deterministic test identities
        run: npm run auth:local:seed

      - name: Run the real-auth smoke subset
        run: npm run test:e2e:real-auth -- --grep @real-auth-smoke

      # Always: a failed run leaves the same threads and messages behind as a
      # passing one, and this deployment is long-lived.
      - name: Clear the test identities' data
        if: always()
        run: npm run auth:local:cleanup

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-real-auth
          path: playwright-report/
          if-no-files-found: ignore

  full-gate:
    # Full rigor only when changes head for main: the complete browser-test
    # suite (dev-mode server on purpose — the movement debug routes are not
    # production-build compatible yet, see the plan's CI notes) plus coverage.
    name: Full Gate (browser tests + coverage)
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node environment
        uses: actions/setup-node@v5
        with:
          node-version: '24.18.0'
          cache: 'npm'

      # The same 1.1GB of packages every run, changing only when the lockfile
      # does. Fetching them was about half the wall time of a check.
      #
      # The Linux rollup binary is installed before the cache is written, so a
      # hit already contains it. If that workaround ever needs to change, bump
      # the key's suffix — a stale cache would otherwise keep serving the old
      # tree and the failure would look unrelated to whatever you changed.
      - name: Restore installed packages
        id: packages
        uses: actions/cache@v4
        with:
          path: node_modules
          key: node-modules-v1-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        if: steps.packages.outputs.cache-hit != 'true'
        run: npm ci

      - name: Workaround NPM Optional Dependency Bug
        if: steps.packages.outputs.cache-hit != 'true'
        run: npm install @rollup/rollup-linux-x64-gnu --no-save

      - name: Restore Playwright browser
        id: playwright
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-v1-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright browser
        if: steps.playwright.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Install Playwright system libraries
        if: steps.playwright.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: Run browser tests
        run: npm run test:e2e

      # Coverage is not run here. The Checks job runs the full unit suite with
      # coverage and enforces the thresholds on every PR — including PRs into
      # main — and both jobs block the merge, so a second run here re-tested
      # the same commit for several metered minutes and could only ever agree.
      # This job's value on a main PR is the full browser suite above.

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore
