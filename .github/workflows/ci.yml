name: CI

on:
  push:
    branches:
      - dev
      - main
  pull_request:
    branches:
      - dev
      - main

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  quality-gate:
    name: Quality Gate
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node environment
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Workaround NPM Optional Dependency Bug
        run: npm install @rollup/rollup-linux-x64-gnu --no-save

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run lint
        run: npm run lint

      - name: Run typecheck
        run: npm run typecheck

      - name: Run unit and integration tests
        run: npm run test:run

      - name: Run browser tests
        run: npm run test:e2e

      - name: Run coverage
        run: npm run test:coverage

      - name: Publish coverage summary
        if: always()
        run: |
          if [ -f coverage/coverage-summary.json ]; then
            node -e "const fs=require('fs'); const s=JSON.parse(fs.readFileSync('coverage/coverage-summary.json','utf8')).total; const rows=['lines','statements','branches','functions'].map((k)=>'| '+k+' | '+s[k].pct+'% | '+s[k].covered+'/'+s[k].total+' |').join('\n'); fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, '### Coverage Summary\n\n| Metric | Percent | Covered |\n| --- | ---: | ---: |\n'+rows+'\n');"
          else
            echo '### Coverage Summary' >> "$GITHUB_STEP_SUMMARY"
            echo 'Coverage summary was not generated.' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          if-no-files-found: ignore

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore
