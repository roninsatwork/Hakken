name: CI

on:
  push:
    branches:
      - dev
  pull_request:
    branches:
      - dev
      - main

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  quality-gate:
    name: Quality Gate
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node environment
        uses: actions/setup-node@v5
        with:
          node-version: '22.13.0'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Workaround NPM Optional Dependency Bug
        run: npm install @rollup/rollup-linux-x64-gnu --no-save

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run lint
        run: npm run lint

      - name: Run typecheck
        run: npm run typecheck

      - name: Run unit and integration tests
        run: npm run test:run

      - name: Run browser tests
        # Dev-mode server on purpose: the movement debug routes these tests
        # exercise are not production-build compatible yet (a standalone-build
        # experiment failed three debug-route specs). The job's timeout-minutes
        # budget is sized for dev-mode compilation instead.
        run: npm run test:e2e

      - name: Run coverage
        run: npm run test:coverage

      - name: Check coverage thresholds
        if: always()
        run: |-
          if [ ! -f coverage/coverage-summary.json ]; then
            echo "coverage/coverage-summary.json was not generated; skipping threshold check."
            exit 0
          fi
          npm run coverage:check

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          if-no-files-found: ignore

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore
