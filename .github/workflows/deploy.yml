name: Build and Deploy to Cloud Run

on:
  push:
    branches:
      - main

# One deploy at a time. Two pushes to main a few minutes apart used to start
# two full deploys side by side: double the billed minutes, and whichever
# finished last won the service — not necessarily the newer commit. Queued,
# never cancelled: a half-finished deploy is worse than a slow one.
concurrency:
  group: deploy-to-cloud-run
  cancel-in-progress: false

# `actions: read` is what lets the step below ask whether this commit already
# passed CI. Everything else the deploy needs comes from the GCP secrets.
permissions:
  contents: read
  actions: read

env:
  PROJECT_ID: ${{ secrets.GCP_PROJECT }}
  REGION: us-central1
  SERVICE: sonae-app
  REPO: sonae-repo
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Without a limit a wedged deploy runs to GitHub's six-hour default and
    # bills the whole way.
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # The step below walks back through recent commits looking for one
          # that passed CI. A default checkout fetches exactly one commit and
          # that walk would see nothing.
          fetch-depth: 50

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_CREDENTIALS }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Setup Node for Convex Backend Sync
        uses: actions/setup-node@v4
        with:
          node-version: '24.18.0'
          cache: 'npm'

      # Same cache as CI. This job used to reinstall 1.1GB from scratch on
      # every release even though the lockfile rarely moves.
      - name: Restore installed packages
        id: packages
        uses: actions/cache@v4
        with:
          path: node_modules
          key: node-modules-v1-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        if: steps.packages.outputs.cache-hit != 'true'
        run: npm ci

      - name: Workaround NPM Optional Dependency Bug
        if: steps.packages.outputs.cache-hit != 'true'
        run: npm install @rollup/rollup-linux-x64-gnu --no-save

      # Scoped to runtime dependencies: this gate exists to block shipping a
      # vulnerable artifact, and devDependencies (ESLint, Vitest, Playwright)
      # are not part of the deployed image.
      #
      # This is deliberately NOT a blanket `npm audit`. The ESLint 9 toolchain
      # transitively pins minimatch@3 -> brace-expansion@1, and the advisory
      # GHSA-mh99-v99m-4gvg has no patched 1.x release. ESLint 10 resolves it
      # but eslint-plugin-react/jsx-a11y still cap their peer range at ESLint 9,
      # so the dev chain cannot currently be made clean. The weekly
      # security-audit workflow tracks it so it is fixed when upstream lands,
      # rather than silently ignored here.
      #
      # Never conditional: an advisory published since the dev run applies to
      # code that has not changed, so a green CI run says nothing about it.
      - name: Run production audit
        run: npm audit --omit=dev --audit-level=high

      # main only ever carries commits that were already on dev, at the same
      # SHA, where CI ran these exact checks against these exact files. Running
      # them again buys no new information and costs about eleven minutes a
      # release. When nothing can be found to vouch for the code the deploy
      # does them itself, so the bar never drops — it is only ever paid for
      # once.
      #
      # The question is about the code, not the commit. CI skips pushes that
      # touch only documents, so a release whose newest commit is a plan or a
      # note has no run of its own and the first version of this step made it
      # pay in full — which, on a repository where plans are written constantly,
      # was most releases. So: walk back for a commit that did run, then ask
      # whether anything CI actually reads has changed since. The two filters
      # below mirror the paths-ignore list in ci.yml and must move with it.
      - name: Look for a passing CI run covering this code
        id: verified
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |-
          passing=$(gh api \
            "repos/${{ github.repository }}/actions/runs?per_page=100" \
            --jq '.workflow_runs[] | select(.name == "CI" and .conclusion == "success") | .head_sha' \
            2>/dev/null || true)

          decide() {
            echo "value=$1" >> "$GITHUB_OUTPUT"
            echo "$2" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          }

          if [ -z "$passing" ]; then
            decide false "Could not read the CI history — running the full checks here."
          fi

          if printf '%s\n' "$passing" | grep -qxF "${{ github.sha }}"; then
            decide true "This commit passed CI — not repeating the checks here."
          fi

          for sha in $(git rev-list --max-count=50 HEAD); do
            printf '%s\n' "$passing" | grep -qxF "$sha" || continue
            changed=$(git diff --name-only "$sha" HEAD | grep -Ev '^docs/|\.md$' || true)
            if [ -z "$changed" ]; then
              decide true "Code unchanged since ${sha:0:9}, which passed CI — not repeating the checks here. Only documents have changed since."
            fi
            decide false "Code has changed since ${sha:0:9}, the last commit to pass CI — running the full checks here."
          done

          decide false "No passing CI run found for this code — running the full checks here."

      # The production deploy used to skip the four source guards and the
      # coverage gate that block every PR, so main was held to a lower bar
      # than a review branch (maintenance plan M3.2).
      - name: Run source guards
        if: steps.verified.outputs.value != 'true'
        run: npm run check:guards

      - name: Run lint
        if: steps.verified.outputs.value != 'true'
        run: npm run lint

      - name: Run typecheck
        if: steps.verified.outputs.value != 'true'
        run: npm run typecheck

      - name: Run unit and integration tests with coverage
        if: steps.verified.outputs.value != 'true'
        run: npm run test:coverage

      - name: Check coverage thresholds
        if: steps.verified.outputs.value != 'true'
        run: npm run coverage:check

      # There is no `npm run build` here any more. It produced a .next/ that
      # nothing read: .dockerignore excludes .next from the build context, and
      # the image builds the app itself in its builder stage. Five minutes a
      # release, spent on output that was thrown away.

      - name: Sync Backend Schema to Convex Production
        run: npx convex deploy
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}

      - name: Configure Docker to use Artifact Registry
        run: |-
          gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      # Buildx so the image layers survive between releases. The `npm ci` layer
      # is the expensive one and it only changes when the lockfile does, but a
      # plain `docker build` starts every release with an empty slate.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Tag every image with the commit SHA as well as :latest. :latest alone
      # is not rollback-able — once it is overwritten the previous image has no
      # name left to deploy. The SHA tag is the immutable handle used by the
      # rollback procedure in docs/developer/deployment.md.
      #
      # `--push` publishes straight from the builder, so the image is never
      # loaded into the local daemon only to be uploaded again.
      #
      # The layer cache lives in the registry, under a `:buildcache` tag, not in
      # GitHub's Actions cache: `type=gha` needs ACTIONS_RUNTIME_TOKEN, which is
      # handed to JavaScript actions and not to a `run:` step, so it would have
      # cached nothing here while appearing to work. Registry cache uses the
      # credentials configured above and outlives the branch that wrote it.
      # `ignore-error=true` keeps a cache problem from failing a release that
      # otherwise built cleanly — including the first run, when there is no
      # `:buildcache` tag to read yet.
      - name: Build and Push Docker image
        env:
          IMAGE_BASE: ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPO }}/${{ env.SERVICE }}
        run: |-
          docker buildx build --progress=plain \
            --build-arg NEXT_PUBLIC_CONVEX_URL=${{ secrets.NEXT_PUBLIC_CONVEX_URL }} \
            --build-arg NEXT_PUBLIC_CONTACT_URL=${{ secrets.NEXT_PUBLIC_CONTACT_URL }} \
            --build-arg CONVEX_SITE_URL=${{ secrets.CONVEX_SITE_URL }} \
            --build-arg CONVEX_DEPLOYMENT=${{ secrets.CONVEX_DEPLOYMENT }} \
            --build-arg BUILD_SHA=${{ github.sha }} \
            --cache-from type=registry,ref="$IMAGE_BASE:buildcache" \
            --cache-to type=registry,ref="$IMAGE_BASE:buildcache",mode=max,ignore-error=true \
            -t "$IMAGE_BASE:${{ github.sha }}" \
            -t "$IMAGE_BASE:latest" \
            --push \
            . > docker_build.log 2>&1 || (echo '### Docker Build Failed! :x:' >> $GITHUB_STEP_SUMMARY; echo '```' >> $GITHUB_STEP_SUMMARY; tail -n 50 docker_build.log >> $GITHUB_STEP_SUMMARY; echo '```' >> $GITHUB_STEP_SUMMARY; cat docker_build.log; exit 1)

      # Deploy the immutable SHA tag, not :latest, so the revision records
      # exactly which image is serving traffic.
      - name: Deploy to Cloud Run
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ env.SERVICE }}
          region: ${{ env.REGION }}
          image: ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPO }}/${{ env.SERVICE }}:${{ github.sha }}
          flags: '--allow-unauthenticated --port=3000'
          env_vars: |-
            NEXT_PUBLIC_CONVEX_URL=${{ secrets.NEXT_PUBLIC_CONVEX_URL }}
            CONVEX_SITE_URL=${{ secrets.CONVEX_SITE_URL }}
            CONVEX_DEPLOYMENT=${{ secrets.CONVEX_DEPLOYMENT }}

      - name: Record deployed revision
        run: |-
          echo "### Deployed \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Verify: \`curl -s https://<service-url>/api/health?deps=1\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Roll back to the previous commit SHA (see docs/developer/deployment.md):" >> $GITHUB_STEP_SUMMARY
          echo '```bash' >> $GITHUB_STEP_SUMMARY
          echo "gcloud run services update ${{ env.SERVICE }} --region ${{ env.REGION }} --image ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPO }}/${{ env.SERVICE }}:<PREVIOUS_SHA>" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
